<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index · Library of Papers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f4f2ee;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: #1c1c1c;
      line-height: 1.6;
      padding: 3rem 1.5rem;
      min-height: 100vh;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      background: #ffffff;
      padding: 3rem 2.8rem;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      border: 1px solid #ddd8d0;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      border-bottom: 3px solid #1c1c1c;
      padding-bottom: 0.7rem;
      margin-bottom: 0.4rem;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 1rem;
      font-style: italic;
      color: #4a4a4a;
      margin-bottom: 2.2rem;
      border-left: 4px solid #a89e8f;
      padding-left: 1.2rem;
    }

    .status {
      font-size: 0.88rem;
      color: #5a5a5a;
      margin-bottom: 1.8rem;
      font-family: 'Helvetica', 'Arial', sans-serif;
      padding: 0.7rem 1rem;
      background: #f8f6f2;
      border-left: 4px solid #b0a494;
      border-radius: 0 4px 4px 0;
    }

    .status.error {
      background: #fdf0ee;
      border-left-color: #c0705a;
      color: #7a2e1a;
    }

    .status.success {
      background: #f0f7f0;
      border-left-color: #6a9a6a;
      color: #2e5a2e;
    }

    .status a {
      color: #7a4e2a;
      text-decoration: none;
      border-bottom: 1px dotted #7a4e2a;
    }

    .status a:hover {
      border-bottom: 1px solid #7a4e2a;
    }

    ul.paper-list {
      list-style: none;
      padding: 0;
      margin: 0;
      border-top: 1px solid #e8e2d9;
    }

    ul.paper-list li {
      border-bottom: 1px solid #e8e2d9;
    }

    ul.paper-list li a {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 1.1rem 1.2rem;
      text-decoration: none;
      color: #1c1c1c;
      border-left: 4px solid transparent;
      transition: background 0.15s ease, border-color 0.15s ease, padding-left 0.15s ease;
    }

    ul.paper-list li a:hover {
      background: #f8f6f2;
      border-left-color: #7a6e5e;
      padding-left: 1.5rem;
    }

    ul.paper-list li a .paper-title {
      font-size: 1.08rem;
      font-weight: 600;
      color: #1c1c1c;
      flex: 1;
      line-height: 1.45;
    }

    ul.paper-list li a .paper-file {
      font-size: 0.8rem;
      font-family: 'Courier New', monospace;
      color: #8a7e6e;
      background: #f2eee8;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    ul.paper-list li a:hover .paper-file {
      background: #e8e2d8;
      color: #5a4e3e;
    }

    .loading {
      text-align: center;
      padding: 2.5rem 1rem;
      color: #7a6e5e;
      font-style: italic;
    }

    .footer-note {
      margin-top: 2.8rem;
      padding-top: 1.4rem;
      border-top: 1px solid #ddd8d0;
      font-size: 0.85rem;
      color: #8a8a8a;
      text-align: center;
      font-style: italic;
    }

    @media (max-width: 600px) {
      body { padding: 1.5rem 0.8rem; }
      .container { padding: 1.8rem 1.2rem; }
      h1 { font-size: 1.5rem; }
      ul.paper-list li a {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.4rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Index</h1>
  <div class="subtitle">Every HTML paper in this folder — click a title to open it</div>

  <div id="status" class="status">Scanning folder…</div>

  <ul id="paper-list" class="paper-list"></ul>

  <div class="footer-note">
    Auto-generated from folder contents · Reload to refresh after adding new files
  </div>
</div>

<script>
  (async function () {
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('paper-list');
    const SELF = 'index.html';  // this file, always excluded from listing

    // ---------------------------------------------------------------
    // Step 1: Discover all HTML files in the current directory.
    // ---------------------------------------------------------------
    let htmlFiles = [];

    try {
      // Fetch the directory listing from the web server (works with
      // python -m http.server, nginx autoindex, Apache, Live Server, etc.)
      const resp = await fetch('./', { cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);

      const text = await resp.text();
      const doc = new DOMParser().parseFromString(text, 'text/html');

      // Collect all href attributes pointing to local .html files
      const anchors = doc.querySelectorAll('a[href]');
      const found = new Set();

      anchors.forEach(a => {
        let href = a.getAttribute('href');
        if (!href) return;

        // Strip query string and fragment
        href = href.split('?')[0].split('#')[0];

        // Skip absolute URLs, parent paths, and subdirectories
        if (href.includes('://')) return;
        if (href.startsWith('/')) return;
        if (href.startsWith('..')) return;
        if (href.includes('/')) return;

        // Must end with .html (case-insensitive)
        if (!href.toLowerCase().endsWith('.html')) return;

        // Skip this index file itself
        if (href.toLowerCase() === SELF) return;

        found.add(href);
      });

      htmlFiles = Array.from(found);
    } catch (err) {
      // Directory listing failed — probably opened via file://
      statusEl.innerHTML =
        '⚠ Could not scan the folder automatically. ' +
        'Please serve this folder with a local web server ' +
        '(e.g. run <code>python3 -m http.server 8000</code> ' +
        'in this folder and open <a href="http://localhost:8000/">' +
        'http://localhost:8000/</a>).';
      statusEl.className = 'status error';
      return;
    }

    if (htmlFiles.length === 0) {
      statusEl.textContent = 'No HTML files found in this folder (besides index.html).';
      statusEl.className = 'status error';
      return;
    }

    // Sort alphabetically by filename for stable ordering
    htmlFiles.sort((a, b) => a.localeCompare(b));

    statusEl.textContent = `Found ${htmlFiles.length} file${htmlFiles.length === 1 ? '' : 's'}. Reading titles…`;
    statusEl.className = 'status';

    // ---------------------------------------------------------------
    // Step 2: Fetch each file and extract its <title> tag.
    // ---------------------------------------------------------------
    const papers = await Promise.all(htmlFiles.map(async (file) => {
      try {
        const r = await fetch(file, { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const html = await r.text();

        const match = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
        let title = match ? decodeEntities(match[1].trim()) : '';

        if (!title) {
          // Fallback: derive a readable title from the filename
          title = file
            .replace(/\.html?$/i, '')
            .replace(/[-_]+/g, ' ')
            .replace(/\s+/g, ' ')
            .trim()
            .replace(/\b\w/g, c => c.toUpperCase());
        }

        return { file, title };
      } catch (err) {
        return {
          file,
          title: file.replace(/\.html?$/i, '').replace(/[-_]+/g, ' ')
        };
      }
    }));

    // ---------------------------------------------------------------
    // Step 3: Render the list.
    // ---------------------------------------------------------------
    listEl.innerHTML = '';

    papers.forEach(({ file, title }) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = file;
      a.rel = 'noopener';

      const titleSpan = document.createElement('span');
      titleSpan.className = 'paper-title';
      titleSpan.textContent = title;

      const fileSpan = document.createElement('span');
      fileSpan.className = 'paper-file';
      fileSpan.textContent = file;

      a.appendChild(titleSpan);
      a.appendChild(fileSpan);
      li.appendChild(a);
      listEl.appendChild(li);
    });

    statusEl.textContent =
      `✓ ${papers.length} paper${papers.length === 1 ? '' : 's'} listed. ` +
      `Click any title to open it.`;
    statusEl.className = 'status success';

    // ---------------------------------------------------------------
    // Helper: decode HTML entities in titles (&amp; → &, etc.)
    // ---------------------------------------------------------------
    function decodeEntities(str) {
      const txt = document.createElement('textarea');
      txt.innerHTML = str;
      return txt.value;
    }
  })();
</script>

</body>
</html>
