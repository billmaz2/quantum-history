<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index · Library of Papers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f4f2ee;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: #1c1c1c;
      line-height: 1.6;
      padding: 3rem 1.5rem;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      background: #fff;
      padding: 3rem 2.8rem;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      border: 1px solid #ddd8d0;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      border-bottom: 3px solid #1c1c1c;
      padding-bottom: 0.7rem;
      margin-bottom: 0.4rem;
    }
    .subtitle {
      font-size: 1rem;
      font-style: italic;
      color: #4a4a4a;
      margin-bottom: 2.2rem;
      border-left: 4px solid #a89e8f;
      padding-left: 1.2rem;
    }
    .status {
      font-size: 0.88rem;
      color: #5a5a5a;
      margin-bottom: 1.8rem;
      font-family: 'Helvetica', 'Arial', sans-serif;
      padding: 0.7rem 1rem;
      background: #f8f6f2;
      border-left: 4px solid #b0a494;
      border-radius: 0 4px 4px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status.error { background: #fdf0ee; border-left-color: #c0705a; color: #7a2e1a; }
    .status.success { background: #f0f7f0; border-left-color: #6a9a6a; color: #2e5a2e; }
    ul.paper-list { list-style: none; padding: 0; margin: 0; border-top: 1px solid #e8e2d9; }
    ul.paper-list li { border-bottom: 1px solid #e8e2d9; }
    ul.paper-list li a {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 1.1rem 1.2rem;
      text-decoration: none;
      color: #1c1c1c;
      border-left: 4px solid transparent;
      transition: background 0.15s, border-color 0.15s, padding-left 0.15s;
    }
    ul.paper-list li a:hover {
      background: #f8f6f2;
      border-left-color: #7a6e5e;
      padding-left: 1.5rem;
    }
    ul.paper-list li a .paper-title { font-size: 1.08rem; font-weight: 600; flex: 1; }
    ul.paper-list li a .paper-file {
      font-size: 0.8rem;
      font-family: 'Courier New', monospace;
      color: #8a7e6e;
      background: #f2eee8;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      white-space: nowrap;
    }
    ul.paper-list li a .paper-file::after {
      content: " ↗";
      font-size: 0.9em;
      color: #b0a494;
    }
    .footer-note {
      margin-top: 2.8rem;
      padding-top: 1.4rem;
      border-top: 1px solid #ddd8d0;
      font-size: 0.85rem;
      color: #8a8a8a;
      text-align: center;
      font-style: italic;
    }
    code { background: #f2eee8; padding: 0.1rem 0.35rem; border-radius: 3px; font-size: 0.9em; }
  </style>
</head>
<body>

<div class="container">
  <h1>Index</h1>
  <div class="subtitle">Every HTML paper in this repository — click a title to open it in a new page</div>
  <div id="status" class="status">Initializing…</div>
  <ul id="paper-list" class="paper-list"></ul>
  <div class="footer-note">Auto-generated from repository contents</div>
</div>

<script>
(async function () {
  const statusEl = document.getElementById('status');
  const listEl   = document.getElementById('paper-list');
  const SELF     = 'index.html';

  const log = (...a) => console.log('[index]', ...a);

  // ---------------------------------------------------------------
  // 1. Work out owner / repo / folder path from the URL
  // ---------------------------------------------------------------
  const host = window.location.hostname;
  const pathParts = window.location.pathname.split('/').filter(Boolean);

  log('hostname:', host);
  log('pathname:', window.location.pathname);
  log('pathParts:', pathParts);

  let owner = null, repo = null, folderPath = '';

  const metaOwner = document.querySelector('meta[name="github-owner"]');
  const metaRepo  = document.querySelector('meta[name="github-repo"]');

  if (metaOwner && metaRepo) {
    owner = metaOwner.content.trim();
    repo  = metaRepo.content.trim();
    folderPath = pathParts.join('/');
    log('Using meta tags for owner/repo');
  } else if (host.endsWith('.github.io')) {
    owner = host.replace(/\.github\.io$/, '');
    repo  = pathParts.shift() || '';
    folderPath = pathParts.join('/');
    log('Parsed from .github.io URL');
  }

  log('owner:', owner, '| repo:', repo, '| folderPath:', JSON.stringify(folderPath));

  if (!owner || !repo) {
    statusEl.innerHTML =
      '⚠ Could not determine GitHub owner/repo from URL.<br>' +
      'Add these to the &lt;head&gt;:<br>' +
      '<code>&lt;meta name="github-owner" content="YOUR-USERNAME"&gt;</code><br>' +
      '<code>&lt;meta name="github-repo" content="YOUR-REPO"&gt;</code>';
    statusEl.className = 'status error';
    return;
  }

  // ---------------------------------------------------------------
  // 2. Fetch the directory listing from the GitHub API
  // ---------------------------------------------------------------
  const candidates = [];
  if (folderPath) candidates.push(folderPath);
  candidates.push('');

  let items = null;
  let usedPath = null;

  for (const path of candidates) {
    const api =
      'https://api.github.com/repos/' +
      encodeURIComponent(owner) + '/' +
      encodeURIComponent(repo) + '/contents/' +
      path.split('/').filter(Boolean).map(encodeURIComponent).join('/');

    log('Fetching:', api);
    statusEl.textContent = 'Fetching ' + api;

    try {
      const resp = await fetch(api, {
        headers: { 'Accept': 'application/vnd.github+json' }
      });

      log('  → HTTP', resp.status);

      if (!resp.ok) {
        log('  → skipping (HTTP ' + resp.status + ')');
        continue;
      }

      const data = await resp.json();
      if (!Array.isArray(data)) {
        log('  → not an array, skipping');
        continue;
      }

      log('  → got ' + data.length + ' entries:',
          data.map(d => d.name + ' (' + d.type + ')'));

      items = data;
      usedPath = path;
      break;
    } catch (err) {
      log('  → fetch error:', err.message);
    }
  }

  if (!items) {
    statusEl.innerHTML =
      '⚠ Could not list files from GitHub API.<br>' +
      'Check the console (F12) for details.<br>' +
      'Repo: <code>' + owner + '/' + repo + '</code>';
    statusEl.className = 'status error';
    return;
  }

  log('Using path:', JSON.stringify(usedPath));

  // ---------------------------------------------------------------
  // 3. Keep only HTML files, exclude index.html
  // ---------------------------------------------------------------
  const htmlFiles = items.filter(item =>
    item.type === 'file' &&
    /\.html?$/i.test(item.name) &&
    item.name.toLowerCase() !== SELF
  );

  log('HTML files after filter:', htmlFiles.map(f => f.name));

  if (htmlFiles.length === 0) {
    statusEl.innerHTML =
      'No HTML files found at path <code>' +
      (usedPath || '/') + '</code>.<br>' +
      'Files present: ' +
      (items.map(i => i.name).join(', ') || '(none)') + '<br>' +
      'Looking for files ending in <code>.html</code> or <code>.htm</code>, ' +
      'excluding <code>index.html</code>.';
    statusEl.className = 'status error';
    return;
  }

  htmlFiles.sort((a, b) => a.name.localeCompare(b.name));

  // ---------------------------------------------------------------
  // 4. Fetch each HTML file and read its <title>
  // ---------------------------------------------------------------
  statusEl.textContent = 'Reading titles…';
  statusEl.className = 'status';

  const papers = await Promise.all(htmlFiles.map(async (f) => {
    const url = f.download_url || f.html_url;
    log('Fetching title from:', url);
    try {
      const resp = await fetch(url, { cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const html = await resp.text();
      const match = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
      let title = match ? decodeEntities(match[1].trim()) : '';
      if (!title) {
        title = f.name.replace(/\.html?$/i, '').replace(/[-_]+/g, ' ')
                 .replace(/\b\w/g, c => c.toUpperCase());
      }
      return { name: f.name, title };
    } catch (err) {
      log('  → error reading title:', err.message);
      return {
        name: f.name,
        title: f.name.replace(/\.html?$/i, '').replace(/[-_]+/g, ' ')
      };
    }
  }));

  // ---------------------------------------------------------------
  // 5. Render — links open in a new page (new tab or new window,
  //    depending on the user's browser settings)
  // ---------------------------------------------------------------
  listEl.innerHTML = '';

  papers.forEach(({ name, title }) => {
    const li = document.createElement('li');
    const a  = document.createElement('a');

    a.href   = name;                   // the URL the link points to
    a.target = '_blank';               // ← opens in a new page
    a.rel    = 'noopener noreferrer';  // security best practice

    const t = document.createElement('span');
    t.className = 'paper-title';
    t.textContent = title;

    const f = document.createElement('span');
    f.className = 'paper-file';
    f.textContent = name;

    a.appendChild(t);
    a.appendChild(f);
    li.appendChild(a);
    listEl.appendChild(li);
  });

  statusEl.textContent =
    '✓ ' + papers.length + ' paper' + (papers.length === 1 ? '' : 's') +
    ' listed (from path "' + (usedPath || '/') + '").';
  statusEl.className = 'status success';

  // ---------------------------------------------------------------
  function decodeEntities(str) {
    const t = document.createElement('textarea');
    t.innerHTML = str;
    return t.value;
  }
})();
</script>

</body>
</html>
